<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DiskMan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 16V3A13 13 0 1 0 29 16Z' fill='%23ff7a45'/%3E%3Cpath d='M19 13V2a11 11 0 0 1 11 11Z' fill='%232dd4bf'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%2315181e'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--bg:#0e1014;--panel:#15181e;--panel2:#1d2129;--fg:#eceef2;--mut:#8a909c;--line:#272b35;--acc:#ff7a45;--acc2:#2dd4bf;--on-acc:#1b0d05;
 --grn:#3ccf91;--amb:#f5b843;--red:#ff4d5e;--glow:0 0 0 1px rgba(255,122,69,.10),0 8px 30px rgba(0,0,0,.35);--accbg:rgba(255,122,69,.14)}
@media (prefers-color-scheme:light){:root{--bg:#f6f5f2;--panel:#fff;--panel2:#f1efea;--fg:#1a1c20;--mut:#636873;--line:#e4e1da;
 --acc:#e8582a;--acc2:#0f9b8e;--on-acc:#fff;--grn:#11865a;--amb:#b26a00;--red:#d92d43;--glow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(60,40,20,.06);--accbg:rgba(232,88,42,.10)}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 ui-sans-serif,-apple-system,system-ui,sans-serif;display:grid;grid-template-columns:224px 1fr;grid-template-rows:auto 1fr}
aside{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.logo{font-weight:800;font-size:18px;padding:0 10px 14px;display:flex;gap:9px;align-items:center;letter-spacing:-.01em}.logo em{font-style:normal;color:var(--acc)}
.logo svg .hole{fill:var(--panel)}.logo{position:relative;cursor:default}.logo>span{display:inline}
.about{display:none;position:absolute;left:8px;top:34px;z-index:40;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:12px;font-weight:400;letter-spacing:0;box-shadow:var(--glow);white-space:nowrap;line-height:1.6}
.logo:hover .about,.logo:focus-within .about{display:block}.about a{color:var(--acc)}
#gq{width:220px}.gdelta.up{color:var(--red)}.gdelta.dn{color:var(--grn)}
.dg{margin-bottom:10px}.dg h4{margin:0 0 6px;font-size:13px;display:flex;gap:10px;align-items:center}
#gsvg text{fill:var(--fg);font-size:11px;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
#gsvg .dim{opacity:.12}#gsvg .nd:not(.lbl):not(.show) text{display:none}#gsvg circle{cursor:pointer;stroke:var(--bg);stroke-width:1.5px}
.navh{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);padding:12px 12px 4px}
aside button{all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;color:var(--mut);display:flex;gap:10px;align-items:center}
aside button:hover{background:var(--panel2);color:var(--fg)}aside button.on{background:linear-gradient(90deg,var(--accbg),transparent);color:var(--fg);box-shadow:inset 2px 0 var(--acc)}
aside button .badge{margin-left:auto;font-size:10px;background:var(--acc);color:var(--on-acc);border-radius:9px;padding:0 6px;font-weight:700}
aside .vols{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px 10px 0}
.vol .mut{font-size:11px}.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.meter.hot i{background:linear-gradient(90deg,var(--amb),var(--red))}
header{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
.crumb{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:13px;flex:1;min-width:200px}.crumb a{padding:2px 6px;border-radius:5px}.crumb a:hover{background:var(--panel2)}
input,select,textarea{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}input[type=checkbox]{accent-color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:default}.btn.sm{padding:3px 9px;font-size:12px}.btn.lg{padding:11px 20px;font-size:15px;border-radius:9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--on-acc)}.seg button:not(.on):hover{background:var(--panel2);color:var(--fg)}
main{overflow:auto;padding:18px 20px;position:relative}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--glow);min-width:0}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .s{color:var(--mut);font-size:12px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.mut{color:var(--mut)}a{color:var(--acc);cursor:pointer;text-decoration:none}.sm{font-size:12px}.path{word-break:break-all}
.donutwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.legend{display:flex;flex-direction:column;gap:5px;font-size:12px;flex:1;min-width:150px}
.legend div{display:flex;gap:8px;align-items:center}.legend b{width:10px;height:10px;border-radius:3px;flex:none}.legend span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}th[data-sort]{cursor:pointer}th[data-sort]:hover{color:var(--fg)}
tbody tr:hover td{background:var(--panel2)}tr.pend td{opacity:.4;text-decoration:line-through}
td.sz{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;width:120px;position:relative}td.sz b{position:absolute;inset:4px auto 4px 0;background:linear-gradient(90deg,rgba(255,122,69,.30),rgba(45,212,191,.16));border-radius:3px}td.sz span{position:relative}
.heat{table-layout:fixed}.heat td{border:2px solid var(--panel);text-align:center;font-size:10.5px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;padding:8px 4px;border-radius:6px;cursor:pointer}
.heat td:not(.rl):not(.empty):hover{outline:2px solid var(--fg);outline-offset:-2px}.heat td.empty{cursor:default}
.heat th{text-align:center;font-size:10px}.heat tr>:first-child{width:118px}.heat td.rl{text-align:left;font-size:12px;background:none!important;cursor:default}
.bars div.r{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(40px,1fr) 70px;gap:10px;align-items:center;padding:4px 0;cursor:pointer;font-size:13px}
.bars .t{height:14px;border-radius:4px;background:var(--line);overflow:hidden}.bars .t i{display:block;height:100%;border-radius:4px}
.bars .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bars .r span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.viz{display:grid;grid-template-columns:1fr 300px;gap:14px;height:calc(100vh - 120px);min-height:460px}
.viz .stage{position:relative;min-height:0}.viz svg{display:block;width:100%;height:100%}
.panel{overflow:auto}.panel .big{font-size:20px;font-weight:700}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#tip{position:fixed;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--glow);display:none;z-index:30;max-width:360px;word-break:break-all}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid currentColor;white-space:nowrap}.safe,.high{color:var(--grn)}.regen,.medium{color:var(--amb)}.low{color:var(--mut)}.risky{color:var(--red)}
.grp td{background:var(--panel2);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.sum{margin-left:auto;font-weight:600}
.spin{padding:60px 20px;text-align:center;color:var(--mut)}
.prog{position:relative;height:4px;background:var(--line);overflow:hidden;border-radius:2px;margin-top:10px}.prog i{position:absolute;inset:0 60% 0 0;background:var(--acc);animation:sl 1.2s infinite ease-in-out}
@keyframes sl{0%{left:-40%;right:100%}100%{left:100%;right:-40%}}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;max-width:520px;display:none;z-index:40}
#jobs{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:35;width:340px;max-width:calc(100vw - 32px)}
.job{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:13px}
.job .jh{display:flex;gap:8px;align-items:center;justify-content:space-between}.job .jh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .jh button{all:unset;cursor:pointer;color:var(--mut);padding:0 4px}.job .jh button:hover{color:var(--fg)}
.job .jb{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 6px}.job .jb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}
.job.ok .jb i{background:var(--grn)}.job .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.quick{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,var(--accbg),transparent 60%),var(--panel)}
.quick .v{font-size:34px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.1}.quick .bars{flex:1;min-width:240px}
svg text{font:11px ui-sans-serif,-apple-system,system-ui,sans-serif;pointer-events:none}
.tm rect,.ic rect,.pk circle{cursor:pointer}.tm g:hover>rect,.ic g:hover>rect{opacity:.85}.pk circle:hover{stroke:var(--fg);stroke-width:1.5}
.sb path{cursor:pointer;stroke:var(--bg);stroke-width:1}.sb path:hover{opacity:.8}
.axis text{fill:var(--mut)}.axis path,.axis line{stroke:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{all:unset;cursor:pointer;font-size:12px;padding:3px 10px;border-radius:14px;border:1px solid var(--line);color:var(--mut);display:inline-flex;gap:6px;align-items:center}
.chip.on{color:var(--fg);border-color:currentColor;background:var(--panel2)}.chip b{width:8px;height:8px;border-radius:50%}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--acc)}.tile.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.tile input{position:absolute;top:8px;left:8px;z-index:2}
.tile .ic{height:96px;display:flex;align-items:center;justify-content:center;font-size:44px;border-radius:7px;background:var(--panel2);overflow:hidden}
.tile .ic img{width:100%;height:100%;object-fit:cover}.tile .nm{font-size:12px;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .mt{font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.photos{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(var(--ph,180px),1fr))}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--panel2);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}.ph:hover img{transform:scale(1.04)}
.ph input{position:absolute;top:7px;left:7px;z-index:2}.ph .cap{position:absolute;inset:auto 0 0 0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11px;display:flex;justify-content:space-between;gap:6px}
.ph .cap span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ph.sel{outline:3px solid var(--acc)}.ph .vid{position:absolute;top:7px;right:8px;color:#fff;text-shadow:0 1px 3px #000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:1100px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;box-shadow:var(--glow)}
.modal .x{float:right}.lb{display:grid;grid-template-columns:1fr 280px;gap:16px}.lb img{max-width:100%;max-height:78vh;display:block;margin:auto;border-radius:8px}
.warn{background:rgba(245,184,67,.12);border:1px solid var(--amb);color:var(--fg);border-radius:9px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.form{display:grid;gap:12px}.form label{display:flex;flex-direction:column;gap:5px;font-size:13px}.form .chk{flex-direction:row;align-items:flex-start;gap:9px}
.form .chk small{display:block;color:var(--mut)}
@media (max-width:900px){body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr}header>div:last-child{flex:1 1 100%;min-width:0}#chg{flex-basis:100%;order:3;margin:0!important}#root{flex:1;min-width:0;max-width:none!important}aside{grid-row:auto;flex-direction:row;overflow:auto;padding:8px}aside .logo,aside .vols,.navh{display:none}#gq{flex:1;min-width:0;width:auto}
 .c3,.c4,.c6,.c8{grid-column:span 12}.viz,.lb{grid-template-columns:1fr;height:auto}.viz .stage{height:65vh}main{padding:12px 16px}}
</style></head><body>
<aside>
 <div class="logo"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 16V3A13 13 0 1 0 29 16Z" fill="var(--acc)"/><path d="M19 13V2a11 11 0 0 1 11 11Z" fill="var(--acc2)"/><circle class="hole" cx="16" cy="16" r="2.6"/></svg><span>Disk<em>Man</em></span><div class="about" id="about"></div></div>
 <div class="navh">Analyze</div>
 <button data-t="overview" class="on">◎ Overview</button>
 <button data-t="treemap">▦ Treemap</button>
 <button data-t="sunburst">◔ Sunburst</button>
 <button data-t="charts">◈ Charts</button>
 <button data-t="explorer">▤ File explorer</button>
 <button data-t="graph">⬡ Graph</button>
 <div class="navh">Find</div>
 <button data-t="search">⌕ Search</button>
 <button data-t="big">⬛ Large files</button>
 <button data-t="dupes">⧉ Duplicates</button>
 <button data-t="old">⏳ Old files</button>
 <button data-t="empty">▢ Empty folders</button>
 <button data-t="growth">↗ Growth</button>
 <div class="navh">Clean up</div>
 <button data-t="suggest">✧ Suggestions <span class="badge" id="sugb" hidden></span></button>
 <button data-t="clean">✦ Cleanup rules</button>
 <button data-t="docker">🐳 Docker</button>
 <button data-t="settings">⚙ Auto-clean & settings</button>
 <div class="vols" id="vols"></div>
</aside>
<header>
 <div class="crumb" id="crumb"></div>
 <input id="gq" type="search" placeholder="Search files and folders  /" aria-label="Search files and folders">
 <div class="mut sm" id="chg" style="margin-left:auto;margin-right:12px"></div>
 <div style="display:flex;gap:8px"><select id="root" aria-label="Folder to scan" style="max-width:320px"></select>
 <button class="btn pri" id="scan">Scan</button></div>
</header>
<main id="main"></main>
<div id="tip"></div><div class="toast" id="toast"></div><div id="jobs"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const api=(p,o={})=>fetch(p,{...o,headers:{'X-DM':'1','Content-Type':'application/json'}}).then(async r=>{if(r.status===401)location.reload(); // oturum bitti → giriş sayfası
 const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j});
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
const q=encodeURIComponent;
const fmt=b=>{if(b==null||b<0)return '—';const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<4){b/=1024;i++}return b.toFixed(i>1?1:0)+' '+u[i]};
const num=n=>n==null?'—':n.toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,w)=>`${num(n)} ${w}${n===1?'':'s'}`;
const age=t=>{const d=(Date.now()/1000-t)/86400;return d<1?'today':d<60?plural(Math.round(d),'day')+' ago':d<730?plural(Math.round(d/30),'month')+' ago':plural(Math.round(d/365),'year')+' ago'};
const thumbUrl=(p,s=256)=>`/api/thumb?s=${s}&path=${q(p)}`;
// one color system: folder branches use PAL, file types use TYPE_COL — same in every chart
const PAL=['#ff7a45','#2dd4bf','#8b8cf8','#f5b843','#f472b6','#5aa9ff','#9ad15a','#c084fc','#fb7185','#38bdf8','#facc15','#34d399','#e879f9','#a3a3ff'];
const TYPE_COL=['#f472b6','#ff7a45','#f5b843','#9ad15a','#5aa9ff','#2dd4bf','#8b8cf8','#ff4d5e','#22c3d6','#c084fc','#6b7280'];
const TYPE_ICO=['🎬','🖼️','🎵','🗜️','📄','💻','📦','💿','🗄️','🧠','📄'];
const MEDIA=new Set([0,1]),THUMBABLE=new Set([0,1,4]);
const S={tab:'overview',focus:null,status:null,sel:null,home:''};
const store={get(k,d){try{return JSON.parse(localStorage.getItem('dm.'+k))??d}catch{return d}},set(k,v){try{localStorage.setItem('dm.'+k,JSON.stringify(v))}catch{}}};
const short=p=>{if(p==='*')return 'All disks';if(p&&S.home&&p.startsWith(S.home))return '~'+p.slice(S.home.length);
 const h=S.status?.hostfs;return h&&p&&(p===h||p.startsWith(h+'/'))?p.slice(h.length)||'/':p}; // container: hide the /host prefix
// '*' = all disks merged into one tree; its children are the disk roots
const within=(p,r)=>p===r||p.startsWith(r.replace(/\/$/,'')+'/');
const inView=p=>{const r=S.status?.root;return !!(p&&r)&&(r==='*'||within(p,r))};
const diskOf=p=>(S.status?.volumes||[]).filter(v=>within(p,v.scan)).sort((a,b)=>b.scan.length-a.scan.length)[0];
const upOf=p=>{const s=S.status;if(p==='*')return p;if(s?.root==='*'&&s.volumes.some(v=>v.scan===p))return '*';
 let u=p.replace(/\/[^/]+\/?$/,'');if(/^[A-Za-z]:$/.test(u))u+='/';return u||'/'};
const textOn=c=>d3.hsl(c).l>.55?'#1a1c20':'#fff';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',7000)}
const tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8);tip.style.left=x+'px';tip.style.top=y+'px'}
const hideTip=()=>tip.style.display='none';
const tipHtml=(d,total)=>`<b>${esc(d.name)}</b><br>${fmt(d.size)}${total?` · ${(d.size/total*100).toFixed(1)}%`:''}${d.n!=null&&d.kind==='dir'?` · ${plural(d.n,'file')}`:''}${d.mtime?`<br><span class="mut">${age(d.mtime)}</span>`:''}${d.kind==='other'||d.kind==='small'?'<br><span class="mut">grouped</span>':''}`;
const spinner=(m='Loading…')=>`<div class="spin">${m}<div class="prog" style="max-width:300px;margin:12px auto"><i></i></div></div>`;
const loading=m=>$('#main').innerHTML=spinner(m);
const fail=e=>$('#main').innerHTML=`<div class="spin">Error: ${esc(e.message)}</div>`;

// ---------- status / scanning ----------
const when=t=>new Date(t*1000).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});
const extraRoots=store.get('roots',[]);
function rootOptions(s){const seen=new Set(),opt=(p,l)=>seen.has(p)?'':(seen.add(p),`<option value="${esc(p)}">${esc(l||short(p))}</option>`);
 const grp=(l,h)=>h?`<optgroup label="${l}">${h}</optgroup>`:'';
 return grp('Disks',opt('*',`All disks — merged (${s.volumes.length})`)+s.volumes.map(v=>opt(v.scan,`${v.name} · ${short(v.path)} · ${fmt(v.used)} used`)).join(''))

function upd(id){const s=SC[id];if(!s)return;const tot=s.rows.filter(r=>s.sel.has(r.path)).reduce((a,r)=>a+Math.max(0,r.size||0),0);
 const e=$('#sum-'+id),b=document.querySelector(`[data-delsel="${id}"]`);if(e)e.textContent=s.sel.size?`${plural(s.sel.size,'item')} · ${fmt(tot)}`:'';if(b)b.disabled=!s.sel.size}
const pend=p=>PEND.has(p)?'class="pend"':'';

async function doDelete(paths,mode,total,opts={}){
 if(!confirm(`${plural(paths.length,'item')} (${fmt(total)}) will be ${mode==='rm'?'PERMANENTLY deleted':'moved to the Trash'} in the background.\n\n`+paths.slice(0,15).map(short).join('\n')+(paths.length>15?'\n…':'')))return null;
 const r=await post(opts.url||'/api/delete',{paths,mode,contents:opts.contents||[]});
 paths.forEach(p=>PEND.add(p));Object.values(SC).forEach(s=>paths.forEach(p=>s.sel.delete(p)));S.sel=null;
 trackJob(r.id,paths);return r}

// ---------- background jobs: queued on the server, progress shown as toasts ----------
const MINE={},HIDE=new Set();let jobT=null,JOBS=[];
function trackJob(id,paths=[]){MINE[id]={paths,open:true};pollJobs()}
async function pollJobs(){clearTimeout(jobT);
 try{JOBS=await api('/api/jobs')}catch{jobT=setTimeout(pollJobs,2000);return}
 let active=false,finished=[];
 for(const j of JOBS){if(!MINE[j.id]&&j.status!=='done')MINE[j.id]={paths:[],open:true}; // e.g. after a reload
  const m=MINE[j.id];if(!m)continue;if(j.status!=='done')active=true;else if(m.open){m.open=false;finished.push(j)}}
 drawJobs();
 if(finished.length)afterJobs(finished);
 if(active)jobT=setTimeout(pollJobs,600)}
function drawJobs(){$('#jobs').innerHTML=JOBS.filter(j=>MINE[j.id]&&!HIDE.has(j.id)).map(j=>{
  const done=j.status==='done',p=done?100:Math.round(100*(j.total?j.bytes/j.total:j.n?j.done/j.n:0)),err=j.errors.length;
  return `<div class="job ${done&&!err?'ok':''}" role="status"><div class="jh"><b title="${esc(j.title)}">${done?(err?'⚠ ':'✓ '):''}${esc(j.title)}</b><button data-jx="${j.id}" aria-label="Dismiss">✕</button></div>
  <div class="jb"><i style="width:${p}%"></i></div>
  <div class="sm mut">${j.status==='queued'?'Queued…':`${p}% · ${num(j.done)}/${num(j.n)} items${j.total?` · ${fmt(j.bytes)} of ${fmt(j.total)}`:''}`}</div>
  ${done?`<div class="sm" style="margin-top:4px">${j.freed?`<b>${fmt(j.freed)}</b> freed`:'Finished'}${err?` · <span class="risky" title="${esc(j.errors.slice(0,8).map(x=>short(x.path)+': '+x.error).join('\n'))}">${plural(err,'error')}</span>`:''}${j.note?`<div class="mut">${esc(j.note)}</div>`:''}</div>`
  :j.cur?`<div class="sm mut cur" title="${esc(j.cur)}">${esc(short(j.cur))}</div>`:''}</div>`}).join('')}
async function afterJobs(finished){
 for(const j of finished){const failed=new Set(j.errors.map(e=>e.path)),ok=MINE[j.id].paths.filter(p=>!failed.has(p));
  MINE[j.id].paths.forEach(p=>PEND.delete(p));
  if(EX.search)EX.search.rows=EX.search.rows.filter(r=>!ok.includes(r.path));
  if(ok.includes(S.focus))S.focus=S.focus.replace(/\/[^/]+$/,'')||'/';
  setTimeout(()=>{HIDE.add(j.id);drawJobs()},15000)}
 cache={};try{S.status=await api('/api/status');drawVols(S.status)}catch{}
 if(!$('#modal').innerHTML)render();loadSugBadge()}

 if(!confirm(`Auto-clean will run: ${plural(p.items.length,'item')}, about ${fmt(p.estimated)}.\nGroups: ${META?.conf.auto.groups.join(', ')}\nMode: ${META?.conf.auto.mode==='trash'?'Trash':'permanent'}`))return;
 const r=await post('/api/auto/run',{});trackJob(r.id)}

// ---------- find: search, duplicates, old files, empty folders, growth ----------
const PER={daily:'Every day',weekly:'Every week (Sunday)',monthly:'Every month (1st day)',yearly:'Every year (1 January)'};
const pid=x=>x.includes(':')?x:'chrome:'+x; // old setting: a bare profile folder means Chrome
function csv(id){const rows=SC[id]?.rows||[],c=v=>`"${String(v??'').replace(/"/g,'""')}"`;
 const txt='path,kind,size_bytes,modified\n'+rows.map(r=>[c(short(r.path)),r.kind||'file',Math.max(0,r.size||0),r.mtime?new Date(r.mtime*1000).toISOString():''].join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=`diskman-${id}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const head=t=>$('#crumb').innerHTML=`<span class="mut">${t}</span>`;
let SQ='',SRV=0,sqT;
const gq=$('#gq');
gq.oninput=()=>{SQ=gq.value;clearTimeout(sqT);sqT=setTimeout(()=>S.tab==='search'?runSearch(SQ):go('search'),200)};
gq.onkeydown=e=>{if(e.key==='Enter'){clearTimeout(sqT);S.tab==='search'?runSearch(gq.value):go('search')}};
addEventListener('keydown',e=>{if(e.key==='/'&&!e.target.closest('input,textarea,select')&&!$('#modal').innerHTML){e.preventDefault();gq.focus()}});
function searchView(){head(`Search · every file and folder in ${esc(short(S.status.root))}`);
 $('#main').innerHTML=`<div class="bar"><input id="sq" type="search" placeholder="File or folder name — several words must all match, e.g. invoice 2024 pdf" value="${esc(SQ)}" style="flex:1;min-width:220px" aria-label="Search files and folders"></div><div id="sres"></div>`;
 const i=$('#sq');if(document.activeElement!==gq)i.focus();i.oninput=()=>{SQ=gq.value=i.value;clearTimeout(sqT);sqT=setTimeout(()=>runSearch(SQ),200)};runSearch(SQ)}
async function runSearch(v){SQ=v.trim();if($('#sq')&&$('#sq').value.trim()!==SQ)$('#sq').value=SQ;const el=$('#sres');if(!el)return;
 if(SQ.length<2){el.innerHTML='<div class="spin">Type at least 2 characters. Every file in the scan is searched, small ones too.</div>';return}
 const t0=performance.now(),my=++SRV;el.innerHTML=spinner('Searching…');
 try{const rows=await api(`/api/search?q=${q(SQ)}&path=${q(S.status.root)}`);if(my!==SRV)return;scope('srch',rows);
  el.innerHTML=selBar('srch','trash',`<span class="mut sm">${plural(rows.length,'result')} in ${Math.round(performance.now()-t0)} ms${rows.length>=300?' · the 300 largest are shown, add words to narrow down':''}</span>`)+(rows.length?fileTable('srch',rows,{path:true}):'<div class="spin">No matches.</div>');upd('srch')}
 catch(e){if(my===SRV)el.innerHTML=`<div class="spin">Error: ${esc(e.message)}</div>`}}

let dupMin=store.get('dupmin',10);
async function dupes(){const rv=RV;head('Duplicate files · byte-for-byte identical (full content hash)');
 let d;try{d=await api('/api/dupes')}catch(e){return fail(e)}if(stale(rv))return;
 const ctl=`<label class="mut">Files of at least <input type=number id=dmin value=${dupMin} min=1 style="width:80px"> MB</label><button class="btn pri" id="drun" ${d.running?'disabled':''}>${d.groups?'Search again':'Find duplicates'}</button>`;
 let body;
 if(d.running){const pct=d.phase==='full'?(d.tbytes?d.bytes/d.tbytes:0):(d.total?d.done/d.total:0);
  body=`<div class="card" style="max-width:640px"><h3>${d.phase==='full'?'Comparing full contents':'Comparing samples'}</h3><div class="kpi"><div class="v">${Math.round(pct*100)}%</div><div class="s">${d.phase==='full'?`${fmt(d.bytes)} of ${fmt(d.tbytes)} read`:`${num(d.done)} of ${plural(d.total,'candidate')}`}</div></div><div class="meter"><i style="width:${pct*100}%"></i></div></div>`;
  setTimeout(()=>!stale(rv)&&dupes(),900)}
 else if(!d.groups)body=`<div class="card" style="max-width:640px"><p>Finds files with exactly the same content anywhere in <b>${esc(short(S.status.root))}</b>: same size first, then a sample of the content, then the full content. Only files that match byte for byte are listed.</p><p class="mut sm">Files over 1 MB are compared. Large disks can take a few minutes; you can leave this page meanwhile.</p></div>`;
 else{const rows=d.groups.flatMap((g,gi)=>g.files.map(f=>({path:f.path,size:g.size,mtime:f.mtime,kind:'file',type:f.type,g:gi})));scope('dup',rows);
  const waste=d3.sum(d.groups,g=>g.size*(g.files.length-1));
  body=`<div class="bar"><span class="mut sm">${plural(d.groups.length,'group')} · <b>${fmt(waste)}</b> can be freed by keeping one copy each${d.root&&d.root!==S.status.root?` · results for ${esc(short(d.root))}`:''} · ${age(d.at)}</span>
   <button class="btn sm" data-dupkeep="new">Select all but the newest</button><button class="btn sm" data-dupkeep="old">Select all but the oldest</button></div>`+
   d.groups.slice(0,500).map((g,gi)=>`<div class="card dg"><h4>${TYPE_ICO[g.files[0].type]??'📄'} ${fmt(g.size)} × ${g.files.length}<span class="mut sm">${fmt(g.size*(g.files.length-1))} extra</span></h4><table>${g.files.map(f=>`<tr ${pend(f.path)}><td style="width:28px">${cbox(f.path,'dup')}</td><td class="path">${esc(short(f.path))}</td><td class="sm mut" style="white-space:nowrap">${age(f.mtime)}</td><td class="sm" style="white-space:nowrap"><a data-ex="${esc(f.path.replace(/\/[^/]*$/,''))}">open</a> · <a data-rv="${esc(f.path)}">Finder</a></td></tr>`).join('')}</table></div>`).join('')+
   (d.groups.length>500?`<div class="spin">The 500 groups that free the most space are shown.</div>`:'')}
 $('#main').innerHTML=(d.groups&&!d.running?selBar('dup','trash',ctl):`<div class="bar">${ctl}</div>`)+body;
 $('#dmin').onchange=e=>{dupMin=+e.target.value||10;store.set('dupmin',dupMin)};
 $('#drun').onclick=async()=>{try{await post('/api/dupes/run',{min:dupMin});dupes()}catch(e){toast('Error: '+e.message)}};upd('dup')}
function dupPick(mode){const s=SC.dup;if(!s)return;s.sel.clear();
 d3.groups(s.rows,r=>r.g).forEach(([,fs])=>{const keep=fs.reduce((a,b)=>(mode==='new'?b.mtime>a.mtime:b.mtime<a.mtime)?b:a);fs.forEach(f=>f!==keep&&!PEND.has(f.path)&&s.sel.add(f.path))});
 document.querySelectorAll('input[data-sc="dup"]').forEach(i=>i.checked=s.sel.has(i.dataset.p));upd('dup')}

let oldYears=store.get('oldy',2),oldMin=store.get('oldmin',50);
async function oldFiles(){const rv=RV;head('Old files · large files nobody changed for years');loading();try{
 const rows=await api(`/api/big?min=${oldMin}&older=${oldYears*365}`);if(stale(rv))return;scope('old',rows);
 $('#main').innerHTML=selBar('old','trash',`<label class="mut">Unchanged for <select id="oy">${[1,2,3,5,10].map(y=>`<option value="${y}" ${y==oldYears?'selected':''}>${plural(y,'year')}</option>`).join('')}</select></label>
  <label class="mut">at least <input type=number id=om value=${oldMin} min=1 style="width:80px"> MB</label><span class="mut sm">${plural(rows.length,'file')} · ${fmt(d3.sum(rows,r=>r.size))}</span>`)+(rows.length?fileTable('old',rows,{path:true}):'<div class="spin">No files match.</div>');
 $('#oy').onchange=e=>{oldYears=+e.target.value;store.set('oldy',oldYears);oldFiles()};$('#om').onchange=e=>{oldMin=+e.target.value||50;store.set('oldmin',oldMin);oldFiles()};upd('old')}catch(e){fail(e)}}

async function emptyView(){const rv=RV;head(`Empty folders in ${esc(short(S.focus))} · no files inside, at most empty subfolders`);loading();try{
 const rows=(await api('/api/empty?path='+q(S.focus))).map(r=>({...r,n:null}));if(stale(rv))return;scope('empty',rows);
 $('#main').innerHTML=selBar('empty','rm',`<span class="mut sm">${plural(rows.length,'empty folder')}${rows.length>=3000?' (first 3000)':''} · apps sometimes expect their empty folders, check before deleting system or app folders</span>`)+(rows.length?fileTable('empty',rows,{path:true}):'<div class="spin">No empty folders here.</div>');upd('empty')}catch(e){fail(e)}}

let GSINCE=null;
async function growthView(){const rv=RV;head(`Growth · what changed in ${esc(short(S.focus))}`);loading();try{
 const d=await api(`/api/growth?path=${q(S.focus)}${GSINCE?'&since='+GSINCE:''}`);if(stale(rv))return;
 if(d.snaps.length<2){$('#main').innerHTML=`<div class="card" style="max-width:640px"><h3>Not enough history yet</h3><p>DiskMan keeps one snapshot of folder sizes per day (last 60 days). Growth compares today with an earlier day, so it needs scans on at least two different days.</p><p class="mut sm">${d.snaps.length?`First snapshot: ${new Date(d.snaps[0]*1000).toLocaleString('en-GB')}. `:''}The service refreshes the scan every night at 04:00.</p></div>`;return}
 const dl=d.new-d.old,mx=d3.max(d.rows,r=>Math.abs(r.delta))||1,sgn=v=>(v>0?'+':v<0?'−':'')+fmt(Math.abs(v));
 $('#main').innerHTML=`<div class="bar"><label class="mut">Compare with <select id="gs">${d.snaps.slice(0,-1).reverse().map(t=>`<option value="${t}" ${Math.abs(t-d.since)<1?'selected':''}>${new Date(t*1000).toLocaleDateString('en-GB',{dateStyle:'medium'})}</option>`).join('')}</select></label>
  <span class="sum">${fmt(d.old)} → ${fmt(d.new)} <span class="gdelta ${dl>0?'up':'dn'}">${sgn(dl)}</span></span></div>
  ${d.rows.length?`<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Folder</th><th style="text-align:right">Before</th><th style="text-align:right">Now</th><th style="text-align:right">Change</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td class="path">📁 <a data-go="${esc(r.path)}">${esc(short(r.path))}</a></td><td class="sm mut" style="text-align:right">${fmt(r.old)}</td><td class="sm" style="text-align:right">${fmt(r.new)}</td>
   <td class="sz"><b style="width:${Math.abs(r.delta)/mx*100}%;background:${r.delta>0?'var(--red)':'var(--grn)'}"></b><span class="gdelta ${r.delta>0?'up':'dn'}">${sgn(r.delta)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="spin">No folder changed by more than 1 MB.</div>'}`;
 $('#gs').onchange=e=>{GSINCE=+e.target.value;growthView()}}catch(e){fail(e)}}

// ---------- graph: folders, file types, containers, apps, duplicates ----------
const GK={root:['Folder you are in','var(--acc)'],dir:['Folders','#5aa9ff'],type:['File types',null],container:['Docker containers','var(--acc2)'],app:['Apps','#8b8cf8'],file:['Duplicate files','#f472b6']};
const GL={contains:'contains',type:'mostly',uses:'mounts',data:'stores data in',dup:'same content'};
let GHIDE=new Set(store.get('ghide',[]));
async function graphView(){const rv=RV;head(`Graph · how folders, file types, containers and apps relate in ${esc(short(S.focus))}`);loading('Building the graph…');let d;
 try{d=await api('/api/graph?path='+q(S.focus))}catch(e){return fail(e)}if(stale(rv))return;
 const kinds=[...new Set(d.nodes.map(n=>n.kind))];
 $('#main').innerHTML=`<div class="bar"><div class="chips">${kinds.filter(k=>k!=='root').map(k=>`<button class="chip ${GHIDE.has(k)?'':'on'}" data-gk="${k}"><b style="background:${GK[k][1]||'#f5b843'}"></b>${GK[k][0]}</button>`).join('')}</div>
  <span class="mut sm" style="margin-left:auto">Click a folder to go inside · drag nodes · scroll to zoom${(S.status.root!==S.focus)?` · <a data-go="${esc(upOf(S.focus))}">⤴ up</a>`:''}${d.nodes.some(n=>n.kind==='file')?'':' · run <a data-t="dupes">Duplicates</a> to see copies here'}</span></div>
  <div class="card" style="padding:0;height:max(420px,calc(100vh - 200px));overflow:hidden"><svg id="gsvg" width="100%" height="100%" role="img" aria-label="Relationship graph"></svg></div>`;
 document.querySelectorAll('[data-gk]').forEach(b=>b.onclick=()=>{const k=b.dataset.gk;GHIDE.has(k)?GHIDE.delete(k):GHIDE.add(k);store.set('ghide',[...GHIDE]);graphView()});
 const nodes=d.nodes.filter(n=>!GHIDE.has(n.kind)),ids=new Set(nodes.map(n=>n.id)),links=d.links.filter(l=>ids.has(l.source)&&ids.has(l.target));
 const el=$('#gsvg'),W=el.clientWidth,H=el.clientHeight,mx=d3.max(nodes,n=>n.size)||1;
 const rad=n=>n.kind==='root'?22:Math.max(5,Math.sqrt((n.size||0)/mx)*30);
 const col=n=>n.kind==='type'?TYPE_COL[n.type]:n.kind==='file'?TYPE_COL[n.type]??'#f472b6':n.kind==='container'&&!n.running?'#4b5260':GK[n.kind][1];
 const lcol={contains:'var(--line)',type:'#f5b843',uses:'var(--acc2)',data:'#8b8cf8',dup:'#f472b6'};
 const svg=d3.select(el),g=svg.append('g');let auto=true;
 const zm=d3.zoom().scaleExtent([.1,5]).on('zoom',e=>{if(e.sourceEvent)auto=false;g.attr('transform',e.transform)});svg.call(zm);
 const fit=()=>{if(!auto||!nodes.length)return;const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y),x0=d3.min(xs)-50,x1=d3.max(xs)+50,y0=d3.min(ys)-40,y1=d3.max(ys)+50,
  k=Math.min(W/(x1-x0),H/(y1-y0),1.4);svg.call(zm.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2))};
 const lk=g.append('g').selectAll('line').data(links).join('line').attr('stroke',l=>lcol[l.kind]).attr('stroke-width',l=>l.kind==='dup'?2.5:l.kind==='contains'?1.2:1.6).attr('stroke-dasharray',l=>l.kind==='uses'||l.kind==='data'?'4 3':l.kind==='dup'?'2 3':null).attr('stroke-opacity',.8);
 const nd=g.append('g').selectAll('g').data(nodes).join('g').attr('class','nd');
 nd.append('circle').attr('r',rad).attr('fill',col);
 nd.classed('lbl',n=>rad(n)>=8||n.kind!=='dir');
 nd.append('text').attr('dy',n=>rad(n)+12).attr('text-anchor','middle').text(n=>{const l=n.label.includes('/')?short(n.label):n.label;return l.length>22?l.slice(0,21)+'…':l});
 const nb=new Map(nodes.map(n=>[n.id,new Set([n.id])]));links.forEach(l=>{nb.get(l.source).add(l.target);nb.get(l.target).add(l.source)});
 let ticks=0;
 const sim=d3.forceSimulation(nodes).alphaDecay(.05).on('end',fit).force('link',d3.forceLink(links).id(n=>n.id).distance(l=>l.kind==='contains'?70:110).strength(l=>l.kind==='contains'?.7:.3))
  .force('charge',d3.forceManyBody().strength(-180)).force('x',d3.forceX(W/2).strength(.05)).force('y',d3.forceY(H/2).strength(.07)).force('center',d3.forceCenter(W/2,H/2)).force('collide',d3.forceCollide(n=>rad(n)+6))
  .on('tick',()=>{if(++ticks%25===0)fit();lk.attr('x1',l=>l.source.x).attr('y1',l=>l.source.y).attr('x2',l=>l.target.x).attr('y2',l=>l.target.y);nd.attr('transform',n=>`translate(${n.x},${n.y})`)});
 nd.call(d3.drag().on('start',(e,n)=>{if(!e.active)sim.alphaTarget(.3).restart();n.fx=n.x;n.fy=n.y}).on('drag',(e,n)=>{n.fx=e.x;n.fy=e.y}).on('end',(e,n)=>{if(!e.active)sim.alphaTarget(0);n.fx=n.fy=null}));
 nd.on('mouseenter',(e,n)=>{const s=nb.get(n.id);nd.classed('dim',m=>!s.has(m.id)).classed('show',m=>s.has(m.id));lk.classed('dim',l=>l.source.id!==n.id&&l.target.id!==n.id);
   const rel=links.filter(l=>l.source.id===n.id||l.target.id===n.id).slice(0,8).map(l=>{const o=l.source.id===n.id?l.target:l.source;return `${l.source.id===n.id?'':'← '}${GL[l.kind]} <b>${esc(o.label)}</b>`}).join('<br>');
   showTip(e,`<b>${esc(n.label)}</b> · ${GK[n.kind][0].replace(/s$/,'')}<br>${fmt(n.size)}${n.image?`<br><span class="mut">${esc(n.image)}${n.running?'':' · stopped'}</span>`:''}${n.path?`<br><span class="mut">${esc(short(n.path))}</span>`:''}${rel?'<br>'+rel:''}`)})
  .on('mousemove',(e)=>{tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8)+'px'})
  .on('mouseleave',()=>{nd.classed('dim',false).classed('show',false);lk.classed('dim',false);hideTip()})
  .on('click',(e,n)=>{hideTip();if((n.kind==='dir'||n.kind==='root')&&n.path!==S.focus)setFocus(n.path);else if(n.kind==='file'){S.tab='explorer';setFocus(n.path.replace(/\/[^/]*$/,''))}else if(n.kind==='container')go('docker')})}

// ---------- events ----------
const SEL='[data-t],[data-go],[data-ex],[data-rv],[data-open],[data-del],[data-delsel],[data-cell],[data-lb],[data-lbn],[data-close],[data-backdrop],[data-chart],[data-metric],[data-view],[data-ft],[data-sort],[data-tile],[data-pick],[data-pickauto],[data-autorun],[data-clearsearch],[data-jx],[data-csv],[data-dupkeep],[data-gnode]';
document.addEventListener('click',async e=>{
 const cb=e.target.matches('input[type=checkbox]')?e.target:null;
 if(cb){const g=cb.dataset;
  if(g.p!==undefined){const s=SC[g.sc];if(s){cb.checked?s.sel.add(g.p):s.sel.delete(g.p);cb.closest('.tile,.ph')?.classList.toggle('sel',cb.checked);upd(g.sc)}}
  const bulk=(id,f)=>{const s=SC[id];if(!s)return;s.rows.filter(r=>f(r)&&!PEND.has(r.path)).forEach(r=>cb.checked?s.sel.add(r.path):s.sel.delete(r.path));document.querySelectorAll(`input[data-sc="${id}"]`).forEach(i=>i.checked=s.sel.has(i.dataset.p));upd(id)};
  if(g.all)bulk(g.all,()=>true);if(g.kind)bulk('sug',r=>r.kind===g.kind);if(g.group)bulk('cl',r=>r.group===g.group);
  return}
 const t=e.target.closest(SEL);if(!t)return;const g=t.dataset;
 try{
 if(g.backdrop!==undefined){if(e.target===t)closeModal();return}
 if(g.close!==undefined)return closeModal();
 if(g.jx){HIDE.add(+g.jx);drawJobs();return}
 if(g.t){closeModal();go(g.t)}
 if(g.go){closeModal();if(!['treemap','sunburst','overview','charts','explorer'].includes(S.tab))S.tab='explorer';setFocus(g.go)}
 if(g.ex){closeModal();S.tab='explorer';setFocus(g.ex)}
 if(g.rv)api('/api/reveal?path='+q(g.rv));
 if(g.open)api('/api/open?path='+q(g.open));
 if(g.del){const r=await doDelete([g.del],'trash',+g.size);if(r){closeModal();render()}}
 if(g.delsel){const s=SC[g.delsel],list=[...s.sel],items=s.rows.filter(r=>s.sel.has(r.path)),mode=$('#mode-'+g.delsel).value;
  const opts=g.delsel==='cl'?{url:'/api/clean/run'}:g.delsel==='sug'?{contents:items.filter(i=>i.contents).map(i=>i.path)}:{};
  const r=await doDelete(list,mode,d3.sum(items,i=>Math.max(0,i.size||0)),opts);if(r){if(g.delsel==='cell')closeModal();render()}}
 if(g.cell){const [i,j]=g.cell.split(',').map(Number);heatCell(i,j)}
 if(g.lb)lightbox(g.lb,g.sc);
 if(g.lbn&&LB)LB.step(+g.lbn);
 if(g.chart){chartKind=g.chart;store.set('chart',chartKind);charts()}
 if(g.metric){chartMetric=g.metric;charts()}
 if(g.view){EX.view=g.view;saveEX();explorer()}
 if(g.ft!==undefined){const v=g.ft==='d'?'d':g.ft==='clear'?null:+g.ft;EX.types=v===null?[]:EX.types.includes(v)?EX.types.filter(x=>x!==v):[...EX.types,v];saveEX();explorer()}
 if(g.sort){EX.dir=EX.sort===g.sort?-EX.dir:(g.sort==='name'?1:-1);EX.sort=g.sort;saveEX();explorer()}
 if(g.tile){const r=SC.ex.rows.find(x=>x.path===g.tile);if(r?.kind==='dir')setFocus(r.path);else if(r&&MEDIA.has(r.type))lightbox(r.path,'ex');else if(r)api('/api/reveal?path='+q(r.path))}
 if(g.pick){const s=SC.sug;s.rows.filter(r=>r.confidence===g.pick&&!PEND.has(r.path)).forEach(r=>s.sel.add(r.path));document.querySelectorAll('input[data-sc="sug"]').forEach(i=>i.checked=s.sel.has(i.dataset.p));upd('sug')}
 if(g.pickauto!==undefined){const s=SC.cl,auto=new Set(META.conf.auto.groups);s.rows.filter(r=>auto.has(r.group)&&!PEND.has(r.path)).forEach(r=>s.sel.add(r.path));document.querySelectorAll('input[data-sc="cl"]').forEach(i=>i.checked=s.sel.has(i.dataset.p));upd('cl')}
 if(g.autorun!==undefined){if(!META)META=await api('/api/clean/meta');await autoRun()}
 if(g.clearsearch!==undefined){EX.search=null;explorer()}
 if(g.csv)csv(g.csv);
 if(g.dupkeep)dupPick(g.dupkeep);
 }catch(er){toast('Error: '+er.message)}
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>['treemap','sunburst','charts'].includes(S.tab)&&render(),250)});
setInterval(()=>api('/api/ping').catch(()=>{}),20000);
poll();pollJobs();
</script></body></html>
